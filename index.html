<script>

const firebaseConfig = {
  apiKey: "AIzaSyBfbGq6nEBWTGc-4-8Ubwe6Ag270iAujBQ",
  authDomain: "oneclick-smalltalk.firebaseapp.com",
  projectId: "oneclick-smalltalk",
  storageBucket: "oneclick-smalltalk.firebasestorage.app",
  messagingSenderId: "570399369244",
  appId: "1:570399369244:web:85ecfe9fe80edb299057d9"
};

let _db = null;
let _fbReady = false;

async function initFirebase() {
  if (_fbReady) return true;
  try {
    await new Promise((res, rej) => {
      if (window.firebase) { res(); return; }
      const s = document.createElement('script');
      s.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
    await new Promise((res, rej) => {
      if (window.firebase && window.firebase.firestore) { res(); return; }
      const s = document.createElement('script');
      s.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js';
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    _db = firebase.firestore();
    _fbReady = true;
    return true;
  } catch(e) {
    console.warn('Firebase 초기화 실패, localStorage 사용:', e);
    return false;
  }

function initUserSelect() {
  document.getElementById('UsSelectContent').style.display = '';
  document.getElementById('UsLoadMsg').style.display = 'none';
  document.getElementById('UsSearchInput').value = '';
  const dd = document.getElementById('UsDropdown');
  dd.innerHTML = '';

  const teamUsers = USERS.filter(u => u.type === 'team');
  const extUsers = USERS.filter(u => u.type === 'ext');

  const teamLabel = document.createElement('div');
  teamLabel.className = 'us-dd-group-label';
  teamLabel.textContent = '📊 영업팀';
  dd.appendChild(teamLabel);

  teamUsers.forEach(u => {
    const item = document.createElement('div');
    item.className = 'us-dd-item';
    item.innerHTML = u.name + '<span class="us-dd-team">' + u.team + '</span>';
    item.onclick = () => { closeUsDropdown(); selectUser(u); };
    dd.appendChild(item);
  });

  const extLabel = document.createElement('div');
  extLabel.className = 'us-dd-group-label';
  extLabel.textContent = '👥 외부 참여';
  dd.appendChild(extLabel);

  extUsers.forEach(u => {
    const item = document.createElement('div');
    item.className = 'us-dd-item';
    item.innerHTML = u.name + '<span class="us-dd-team">' + u.team + '</span>';
    item.onclick = () => { closeUsDropdown(); selectUser(u); };
    dd.appendChild(item);
  });
}

function toggleUsDropdown() {
  const dd = document.getElementById('UsDropdown');
  dd.classList.toggle('open');
}

function closeUsDropdown() {
  document.getElementById('UsDropdown').classList.remove('open');
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.us-search-wrap')) closeUsDropdown();
});

async function selectUser(user) {
  currentUser = user;
  localStorage.setItem(USER_KEY, user.id);

  // 로딩 화면 표시
  document.getElementById('UsSelectContent').style.display = 'none';
  document.getElementById('UsLoadMsg').style.display = 'block';
  document.getElementById('UsLoadName').textContent = user.name + '님의 데이터를 불러오는 중...';

  // 메모 초기화 (이전 사용자 데이터 제거)
  Object.keys(DATA).forEach(name => {
    DATA[name].memo = (MEMOS[name] && MEMOS[name].length > 0) ? JSON.parse(JSON.stringify(MEMOS[name])) : [];
  });

  // Firestore에서 메모 불러오기
  await loadMemosFromFirestore(user.id);

  // 오버레이 숨기기
  document.getElementById('UserSelect').classList.add('hidden');
  document.getElementById('UserBadgeName').textContent = user.name;

  // 환영 메시지
  document.getElementById('Result').innerHTML =
    '<div class="card" style="text-align:center;padding:40px 20px;color:#6B6963;">' +
    '<h3 style="color:#1D9E75;margin:0 0 8px;">👋 ' + user.name + '님, 환영합니다!</h3>' +
    '<p style="margin:0;font-size:13px;">위 검색창을 클릭하면 거래처 목록이 표시됩니다.<br>메모는 자동으로 클라우드에 저장됩니다.</p></div>';
}

function changeUser() {
  currentUser = null;
  localStorage.removeItem(USER_KEY);
  document.getElementById('UserSelect').classList.remove('hidden');
  document.getElementById('Q').value = '';
  document.getElementById('Dropdown').style.display = 'none';
  document.getElementById('Result').innerHTML = '';
  initUserSelect();
}

function makeData(arr) {
  const [name, region, pharmacist, grade, sales, trend, returnRate, debt, monthGoal, pbRatio, hasVet, vetM, route, lat, lng] = arr;
  const annual = sales * 11;
  let proR;
  if (pbRatio >= 15) proR = 18;
  else if (returnRate > 4 || trend.startsWith('-')) proR = 58;
  else if (grade === 'A') proR = 42;
  else proR = 50;
  const remaining = 100 - pbRatio - proR;
  const genR = Math.round(remaining * 0.6);
  const hsR = 100 - proR - genR - pbRatio;
  const catRatio = { pro: proR, gen: genR, hs: hsR, pb: pbRatio };
  const catSales = { pro: Math.round(annual*proR/100), gen: Math.round(annual*genR/100), hs: Math.round(annual*hsR/100), pb: Math.round(annual*pbRatio/100) };
  const pos = trend.startsWith('+');
  const catTrend = {
    pro: pos ? '+'+(Math.floor(Math.random()*10)+3)+'%' : '-'+(Math.floor(Math.random()*8)+3)+'%',
    gen: pos ? '+'+(Math.floor(Math.random()*6)+1)+'%' : '-'+(Math.floor(Math.random()*6)+2)+'%',
    hs: '+'+(Math.floor(Math.random()*15)+5)+'%',
    pb: trend
  };
  const monthCurrent = Math.round(sales * 0.81);
  const daily = [0];
  for (let i=1; i<=30; i++) {
    if (i>=24) daily.push(monthCurrent);
    else daily.push(Math.round(monthCurrent * i / 24));
  }
  const proItems = ['아모디핀 5mg','리피토 10mg','메트포르민 500mg','오메프라졸 20mg','엘트로신','암로디핀','디아미크롱','바이엘 아스피린'];
  const genItems = ['타이레놀 500mg','판콜에이','훼스탈 골드','게보린','활명수','베나치오','판피린'];
  const hsItems = ['센트룸 종합비타민','오메가3 1000mg','프로바이오틱스 60포','루테인','밀크씨슬','콜라겐'];
  const pbItems = ['태전 종합비타민','태전 프로바이오 30포','태전 칼슘마그네슘','태전 오메가3','태전 위장약'];
  function gT(items, total, maxC) {
    const c = Math.min(items.length, maxC);
    return items.slice(0, c).map((n, i) => ({ name: n, sales: Math.round(total / c * (1.5 - i * 0.15)) }));
  }
  const proTop = gT(proItems, catSales.pro, Math.min(8, Math.max(3, Math.floor(sales/700000))));
  const genTop = gT(genItems, catSales.gen, Math.min(7, Math.max(3, Math.floor(sales/800000))));
  const hsTop = gT(hsItems, catSales.hs, Math.min(6, Math.max(2, Math.floor(sales/1100000))));
  const pbMonthly = Math.round(sales * pbRatio / 100);
  const pbCount = Math.min(pbItems.length, Math.max(1, Math.floor(pbMonthly / 220000)));
  const pbThisMonthItems = pbItems.slice(0, pbCount).map((n, i) => {
    const itemSales = Math.round(pbMonthly / pbCount * (1.4 - i * 0.18));
    return { name: n, qty: Math.max(1, Math.round(itemSales / 92000)), sales: itemSales };
  });
  return {
    name, region, pharmacist, grade, sales, salesTrend: trend, returnRate, debt,
    monthGoal, monthCurrent, monthDay: 24, monthDays: 30,
    daily, proTop, genTop, hsTop, pbThisMonthItems,
    catRatio, catSales, catTrend,
    pb3mAvg: (PHARMACY_REAL[name]) ? Math.round(PHARMACY_REAL[name].pb / 6) : Math.round(pbMonthly * 0.92),
    vet3mAvg: (PHARMACY_REAL[name]) ? Math.round(PHARMACY_REAL[name].animal / 6) : (hasVet ? Math.round(vetM * 100000) : 0),
    news: NEWS,
    memo: [],
    route, lat, lng,
    // 전문약 등급별 비율 (실제 데이터 입력 전 샘플)
    proGrade: (PHARMACY_REAL[name] && PHARMACY_REAL[name].proGrade) ? PHARMACY_REAL[name].proGrade : { A: 30, B: 25, C: 20, D: 15, E: 7, F: 3 }
  };
}

function fmt(n) {
  if (n >= 100000000) return (n/100000000).toFixed(1)+'억';
  if (n >= 10000) return (n/10000).toFixed(0)+'만원';
  return n.toLocaleString()+'원';
}

function onQuery() {
  const q = document.getElementById('Q').value.trim();
  const dd = document.getElementById('Dropdown');
  if (!q) {
    const all = Object.keys(DATA);
    dd.innerHTML = '<div class="dd-count">거래처 (총 ' + all.length + '곳)</div>' +
      all.slice(0, 6).map(ddRow).join('');
    dd.style.display = 'block'; return;
  }
  const matches = Object.keys(DATA).filter(name => name.includes(q));
  if (matches.length === 0) {
    dd.innerHTML = '<div class="dd-empty">"' + q + '" 매칭 거래처 없음</div>';
  } else {
    dd.innerHTML = '<div class="dd-count">' + matches.length + '곳 매칭</div>' + matches.map(ddRow).join('');
  }
  dd.style.display = 'block';
}

function ddRow(name) {
  const d = DATA[name];
  const gC = d.grade === 'B' ? 'dd-grade dd-grade-B' : d.grade === 'C' ? 'dd-grade dd-grade-C' : 'dd-grade';
  return '<div class="dd-item" onclick="pick(\'' + name + '\')"><div><span class="dd-name">' + name + '</span><span class="' + gC + '">' + d.grade + '</span></div><div class="dd-sub">' + d.region + ' · 약사 ' + d.pharmacist + ' · ' + fmt(d.sales) + ' (<span class="' + (d.salesTrend.startsWith('+')?'up':'down') + '">' + d.salesTrend + '</span>)</div></div>';
}

function pick(name) {
  document.getElementById('Q').value = name;
  document.getElementById('Dropdown').style.display = 'none';
  render(name);
}

function doSearch() {
  const q = document.getElementById('Q').value.trim();
  if (!q) return;
  const found = Object.keys(DATA).find(k => k.includes(q));
  if (found) pick(found);
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.search')) document.getElementById('Dropdown').style.display = 'none';
});

function switchTab(tab) {
  curTab = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.getElementById('tab-content').innerHTML = renderTab(curName, tab);
}

function renderTab(name, tab) {
  const d = DATA[name];
  let list, label, catClass;
  if (tab === 'pro') { list = d.proTop; label = '전문약'; catClass = 'pro'; }
  else if (tab === 'gen') { list = d.genTop; label = '일반약'; catClass = 'gen'; }
  else if (tab === 'hs') { list = d.hsTop; label = '건기식'; catClass = 'hs'; }
  else { list = d.pbThisMonthItems; label = 'PB'; catClass = 'pb'; }
  const total = list.reduce((s, x) => s + x.sales, 0);
  let h = '<div class="tab-summary">';
  h += '<div class="tab-sum-item"><span class="tab-sum-label">'+label+' 품목</span><span class="tab-sum-val">'+list.length+'개</span></div>';
  h += '<div class="tab-sum-item"><span class="tab-sum-label">매출 합계</span><span class="tab-sum-val">'+fmt(total)+'</span></div>';
  h += '<div class="tab-sum-item"><span class="tab-sum-label">비중</span><span class="tab-sum-val">'+d.catRatio[tab]+'%</span></div>';
  h += '<div class="tab-sum-item"><span class="tab-sum-label">전월 대비</span><span class="tab-sum-val '+(d.catTrend[tab].startsWith('+')?'up':'down')+'">'+d.catTrend[tab]+'</span></div>';
  h += '</div>';
  if (list.length === 0) { h += '<div class="empty">해당 카테고리 매출 내역 없음 — 영업 기회!</div>'; return h; }
  list.forEach((item, i) => {
    const rc = tab === 'pb' ? 'top-row top-row-pb' : 'top-row';
    h += '<div class="'+rc+'"><div class="top-rank"'+(tab==='pb'?' style="color:#3C3489;"':'')+'>'+(i+1)+'</div>';
    h += '<div class="top-name"'+(tab==='pb'?' style="color:#3C3489;font-weight:600;"':'')+'>'+item.name+(item.qty?' <span style="font-size:11px;color:#7F77DD;">'+item.qty+'개</span>':'')+'</div>';
    h += '<span class="top-cat cat-'+catClass+'">'+label+'</span>';
    h += '<div class="top-amount"'+(tab==='pb'?' style="color:#3C3489;"':'')+'>'+fmt(item.sales)+'</div></div>';
  });
  return h;
}

function render(name) {
  curName = name; curTab = 'pro';
  const d = DATA[name];
  const pct = Math.round(d.monthCurrent / d.monthGoal * 100);
  const remaining = d.monthGoal - d.monthCurrent;
  const remainingDays = d.monthDays - d.monthDay;

function insertTag(tag) {
  const el = document.getElementById('Memo');
  if (!el) return;
  const now = new Date();
  const t = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const text = '['+t+'] ' + tag + ' — ';
  const pos = el.selectionStart;
  el.value = el.value.slice(0, pos) + (el.value.length > 0 && el.value[el.value.length-1] !== '\n' && pos === el.value.length ? '\n' : '') + text;
  el.focus();
  el.selectionStart = el.selectionEnd = el.value.length;
}

function clearMemoInput() {
  const el = document.getElementById('Memo');
  if (el) { el.value = ''; el.focus(); }
}

// ============================================================
// 음성 입력
// ============================================================
let recognition = null;
let isRecording = false;

function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.lang = 'ko-KR'; r.continuous = true; r.interimResults = true;
  return r;
}

function toggleVoice(name) {
  const btn = document.getElementById('VoiceBtn');
  const status = document.getElementById('VoiceStatus');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('이 브라우저는 음성 입력을 지원하지 않습니다.\nSafari(iOS 14.5+) 또는 Chrome에서 이용하세요.'); return; }
  if (isRecording) {
    if (recognition) recognition.stop();
    isRecording = false;
    btn.classList.remove('recording'); btn.textContent = '🎤';
    status.textContent = '음성'; status.classList.remove('active');
  } else {
    recognition = initRecognition();
    if (!recognition) return;
    isRecording = true;
    btn.classList.add('recording'); btn.textContent = '⏹';
    status.textContent = '녹음 중...'; status.classList.add('active');
    const el = document.getElementById('Memo');
    let baseText = el.value;
    recognition.onresult = function(e) {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      if (final) { baseText += final + ' '; }
      el.value = baseText + interim;
      el.scrollTop = el.scrollHeight;
    };
    recognition.onerror = function(e) {
      isRecording = false;
      if (btn) { btn.classList.remove('recording'); btn.textContent = '🎤'; }
      if (status) { status.textContent = '음성'; status.classList.remove('active'); }
      if (e.error !== 'aborted') alert('음성 인식 오류: ' + e.error);
    };
    recognition.onend = function() { if (isRecording) recognition.start(); };
    recognition.start();
  }
}

// 라이브러리 동적 로드

function loadScript(src, check) {
  return new Promise((resolve, reject) => {
    if (window[check]) { resolve(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

// ============================================================
function drawDaily(data, goal, days) {
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js', 'Chart').then(() => {
    const ctx = document.getElementById('DailyChart');
    if (!ctx) return;
    const goalLine = [];
    for (let i=0; i<=days; i++) goalLine.push(Math.round(goal/days*i));
    new Chart(ctx, {
      type: 'line',
      data: { labels: data.map((_,i)=>i), datasets: [
        { label: '실제 누적', data: data, borderColor: '#1D9E75', backgroundColor: 'rgba(29,158,117,0.1)', fill: true, tension: 0.3, pointRadius: 0 },
        { label: '목표선', data: goalLine, borderColor: '#888780', borderDash: [4,4], fill: false, pointRadius: 0 }
      ]},
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: true, position: 'bottom', labels: { font: { size: 11 } } } },
        scales: {
          y: { beginAtZero: true, ticks: { font: { size: 10 }, callback: v => (v/10000).toFixed(0)+'만' } },
          x: { ticks: { font: { size: 10 }, callback: (v,i) => i%5===0 ? i+'일' : '' } }
        }
      }
    });
  }).catch(() => {});
}

function drawCat(ratio) {
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js', 'Chart').then(() => {
    const ctx = document.getElementById('CatChart');
    if (!ctx) return;
    new Chart(ctx, {
      type: 'doughnut',
      data: { labels: ['전문약','일반약','건기식','PB'], datasets: [{ data: [ratio.pro, ratio.gen, ratio.hs, ratio.pb], backgroundColor: ['#378ADD','#EF9F27','#97C459','#7F77DD'], borderWidth: 0 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: true, position: 'right', labels: { font: { size: 12 } } }, tooltip: { callbacks: { label: c => c.label+': '+c.parsed+'%' } } }, cutout: '60%' }
    });
  }).catch(() => {});
}

function drawGrade(proGrade) {
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js', 'Chart').then(() => {
    const ctx = document.getElementById('GradeChart');

function editSales(name) {
  const d = DATA[name];
  const input = prompt(
    '[ ' + name + ' ] 이번달 매출 수정\n현재: ' + d.sales.toLocaleString() + '원\n\n실제 매출 금액을 입력하세요 (숫자만):',
    d.sales
  );
  if (input === null) return;
  const newSales = parseInt(String(input).replace(/[^0-9]/g, ''));
  if (isNaN(newSales) || newSales < 0) { alert('올바른 금액을 입력해주세요.'); return; }
  DATA[name].sales = newSales;
  DATA[name].monthCurrent = Math.round(newSales * 0.81);
  saveSalesToFirestore();
  render(name);
}

async function saveSalesToFirestore() {
  if (!currentUser) return;
  try {
    const ok = await initFirebase();
    if (!ok) return;
    const sales = {};
    Object.keys(DATA).forEach(n => { sales[n] = DATA[n].sales; });
    await _db.collection('users').doc(currentUser.id).set({ sales }, { merge: true });
  } catch(e) { console.warn('Sales save failed:', e); }
}

function editGoal(name) {
  const d = DATA[name];
  const input = prompt(
    '[ ' + name + ' ] 월 목표 금액 수정\n현재: ' + d.monthGoal.toLocaleString() + '원\n\n새 목표 금액을 입력하세요 (숫자만):',
    d.monthGoal
  );
  if (input === null) return;
  const newGoal = parseInt(String(input).replace(/[^0-9]/g, ''));
  if (isNaN(newGoal) || newGoal <= 0) { alert('올바른 금액을 입력해주세요.'); return; }
  DATA[name].monthGoal = newGoal;
  saveGoalsToFirestore();
  render(name);
}

async function saveGoalsToFirestore() {
  if (!currentUser) return;
  try {
    const ok = await initFirebase();
    if (!ok) return;
    const goals = {};
    Object.keys(DATA).forEach(n => { goals[n] = DATA[n].monthGoal; });
    await _db.collection('users').doc(currentUser.id).set({ goals }, { merge: true });
  } catch(e) { console.warn('Goals save failed:', e); }
}

// ============================================================
// 메모 — Firestore + localStorage 이중 저장
// ============================================================
const MEMO_KEY = 'oneclick-smalltalk-memos-v4';

function loadMemosFromStorage() {
  try {
    const saved = localStorage.getItem(MEMO_KEY);
    if (!saved) return;
    const memos = JSON.parse(saved);
    Object.keys(memos).forEach(name => { if (DATA[name]) DATA[name].memo = memos[name]; });
  } catch(e) {}
}

function saveMemosToStorage() {
  try {
    const memos = {};
    Object.keys(DATA).forEach(name => { if (DATA[name].memo && DATA[name].memo.length > 0) memos[name] = DATA[name].memo; });
    localStorage.setItem(MEMO_KEY, JSON.stringify(memos));
  } catch(e) {}
}

async function loadMemosFromFirestore(userId) {
  try {
    const ok = await initFirebase();
    if (!ok) { loadMemosFromStorage(); return; }
    // 5초 타임아웃 적용
    const doc = await Promise.race([
      _db.collection('users').doc(userId).get(),
      new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 5000))
    ]);
    if (doc.exists) {
      const data = doc.data();
      if (data.memos) {
        Object.keys(data.memos).forEach(name => { if (DATA[name]) DATA[name].memo = data.memos[name]; });
      }
      if (data.goals) {
        Object.keys(data.goals).forEach(name => { if (DATA[name]) DATA[name].monthGoal = data.goals[name]; });
      }
      if (data.sales) {
        Object.keys(data.sales).forEach(name => {
          if (DATA[name]) {
            DATA[name].sales = data.sales[name];
            DATA[name].monthCurrent = Math.round(data.sales[name] * 0.81);
          }
        });
      }
    }
  } catch(e) {
    console.warn('Firestore 불러오기 실패, localStorage 사용:', e);
    loadMemosFromStorage();
  }
}

async function saveMemosToFirestore() {
  if (!currentUser) { saveMemosToStorage(); return; }
  try {
    const ok = await initFirebase();
    if (!ok) { saveMemosToStorage(); return; }
    const memos = {};
    Object.keys(DATA).forEach(name => { if (DATA[name].memo && DATA[name].memo.length > 0) memos[name] = DATA[name].memo; });
    await _db.collection('users').doc(currentUser.id).set({ memos }, { merge: true });
    saveMemosToStorage();
  } catch(e) {
    console.warn('Firestore 저장 실패, localStorage 사용:', e);
    saveMemosToStorage();
  }
}

function saveMemo(name) {
  const txt = document.getElementById('Memo').value.trim();
  if (!txt) return;
  const now = new Date();
  const t = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  DATA[name].memo.unshift({ time: t, text: txt, ai: null });
  saveMemosToFirestore();
  render(name);
}

function deleteMemo(name, index) {
  if (!confirm('이 메모를 삭제하시겠습니까?')) return;
  DATA[name].memo.splice(index, 1);
  saveMemosToFirestore();
  render(name);
}

// ============================================================
// 메모 내보내기 (CSV)
// ============================================================
function exportMemos() {
  const rows = [['거래처명', '등급', '담당루트', '작성일시', '메모내용']];
  let totalCount = 0;
  Object.keys(DATA).forEach(name => {
    const d = DATA[name];
    if (d.memo && d.memo.length > 0) {
      d.memo.forEach(m => {
        rows.push([name, d.grade || '', d.route || '', m.time || '', m.text || '']);
        totalCount++;
      });
    }
  });
  if (totalCount === 0) { alert('저장된 메모가 없습니다.'); return; }
  const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = new Date();
  const ds = today.getFullYear() + ('0'+(today.getMonth()+1)).slice(-2) + ('0'+today.getDate()).slice(-2);
  const userName = currentUser ? '_' + currentUser.name : '';
  a.href = url; a.download = '원클릭스몰톡_메모' + userName + '_' + ds + '.csv';
  a.click(); URL.revokeObjectURL(url);
}

// ============================================================
// 지도
// ============================================================
let leafletMap = null;
let locMarker = null;

function openMap() {
  document.getElementById('MapModal').classList.add('open');
  if (!document.querySelector('link[href*="leaflet"]')) {
    const lnk = document.createElement('link');
    lnk.rel = 'stylesheet';
    lnk.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
    document.head.appendChild(lnk);
  }
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js', 'L').then(() => {
    setTimeout(initMap, 100);
  }).catch(() => {
    document.getElementById('map').innerHTML = '<div style="padding:20px;text-align:center;color:#666;">지도를 로드할 수 없습니다.</div>';
  });
}

function closeMap() {
  document.getElementById('MapModal').classList.remove('open');
}

function initMap() {
  if (leafletMap) { leafletMap.invalidateSize(); return; }
  leafletMap = L.map('map').setView([35.948, 126.958], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors', maxZoom: 19
  }).addTo(leafletMap);

  Object.values(DATA).forEach(d => {
    if (!d.lat || !d.lng) return;
    const marker = L.circleMarker([d.lat, d.lng], { radius: 10, fillColor: '#1D74C8', color: '#fff', weight: 2, opacity: 1, fillOpacity: 0.9 }).addTo(leafletMap);
    const popupHtml = `<div class="lf-popup" style="min-width:200px;">
      <h4>🏪 ${d.name} <span class="lf-grade">등급 ${d.grade}</span></h4>
      <div class="lf-sub">${d.region}</div>
      <div class="lf-sales">${fmt(d.sales)} <span style="color:${d.salesTrend.startsWith('+')?'#639922':'#E24B4A'};font-size:12px;">${d.salesTrend}</span></div>
      <button class="lf-btn" onclick="pickFromMap('${d.name}')">자세히 보기 →</button>
    </div>`;
    marker.bindPopup(popupHtml, { maxWidth: 260 });
  });
}

function pickFromMap(name) {
  closeMap();
  document.getElementById('Q').value = name;
  pick(name);
}

function locateMe() {
  if (!navigator.geolocation) { alert('이 브라우저는 위치 서비스를 지원하지 않습니다.'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    if (!leafletMap) return;
    if (locMarker) locMarker.remove();
    locMarker = L.circleMarker([lat, lng], { radius: 8, fillColor: '#E24B4A', color: '#fff', weight: 2, fillOpacity: 1 }).addTo(leafletMap);
    locMarker.bindPopup('📍 내 현재 위치').openPopup();
    leafletMap.setView([lat, lng], 14);
  }, () => { alert('위치를 가져올 수 없습니다. 위치 권한을 허용해주세요.'); });
}
