<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>원클릭 스몰톡 v0.6.0 — 실매출 데이터 적용</title>
<style>
* { box-sizing: border-box; }
body { font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; background: #F5F4EE; color: #1F1E1D; margin: 0; padding: 20px; font-size: 14px; line-height: 1.5; }
.container { max-width: 1100px; margin: 0 auto; }
.header { background: #fff; border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; border: 1px solid #E8E6DC; }
.header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.header h1 { margin: 0 0 2px; font-size: 20px; color: #1F1E1D; }
.header p { margin: 0; font-size: 12px; color: #6B6963; }
.map-btn { padding: 10px 18px; background: #1D9E75; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 600; white-space: nowrap; min-height: 44px; }
.map-btn:active { background: #16785a; }
.export-btn { padding: 10px 18px; background: #fff; color: #1D9E75; border: 2px solid #1D9E75; border-radius: 10px; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 600; white-space: nowrap; min-height: 44px; }
.export-btn:active { background: #F0FBF6; }
.user-badge { padding: 8px 14px; background: #F0FBF6; color: #1D9E75; border: 1.5px solid #1D9E75; border-radius: 10px; cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600; white-space: nowrap; min-height: 44px; display: flex; align-items: center; gap: 6px; }
.user-badge:hover { background: #E0F5EE; }
.search { display: flex; gap: 8px; margin-bottom: 6px; position: relative; }
.search input { flex: 1; padding: 12px 14px; border: 1px solid #E8E6DC; border-radius: 8px; font-size: 15px; background: #fff; font-family: inherit; min-height: 44px; }
.search input:focus { outline: none; border-color: #1D9E75; box-shadow: 0 0 0 3px rgba(29,158,117,0.1); }
.search button { padding: 10px 18px; border: 1px solid #E8E6DC; background: #fff; border-radius: 8px; cursor: pointer; font-size: 14px; font-family: inherit; min-height: 44px; }
.search button:hover { background: #F5F4EE; }
.dd { position: absolute; top: 100%; left: 0; right: 80px; background: #fff; border: 1px solid #E8E6DC; border-radius: 10px; margin-top: 6px; max-height: 70vh; overflow-y: auto; z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
.dd-count { padding: 8px 14px; font-size: 12px; color: #6B6963; border-bottom: 1px solid #F0EEE5; background: #FAFAF6; }
.dd-item { padding: 14px 16px; cursor: pointer; border-bottom: 1px solid #F0EEE5; transition: background 0.1s; }
.dd-item:last-child { border-bottom: none; }
.dd-item:hover, .dd-item:active { background: #F5F4EE; }
.dd-name { font-size: 15px; font-weight: 600; }
.dd-grade { font-size: 11px; padding: 2px 7px; border-radius: 4px; background: #E6F1FB; color: #0C447C; margin-left: 6px; font-weight: 600; }
.dd-grade-B { background: #FAEEDA; color: #633806; }
.dd-grade-C { background: #FBE5E5; color: #7C0C0C; }
.dd-sub { font-size: 12px; color: #6B6963; margin-top: 3px; }
.dd-empty { padding: 18px; text-align: center; color: #6B6963; font-size: 14px; }
.hint { padding: 10px 14px; background: #FAFAF6; border-radius: 8px; font-size: 12px; color: #6B6963; margin-bottom: 14px; border: 1px dashed #E8E6DC; }
.card { background: #fff; border: 1px solid #E8E6DC; border-radius: 12px; padding: 16px 20px; margin-bottom: 14px; }
.card-pb { border: 2px solid #7F77DD; }
.head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #F0EEE5; flex-wrap: wrap; gap: 8px; }
.title { font-size: 18px; font-weight: 600; margin: 0; }
.sub { font-size: 13px; color: #6B6963; margin: 2px 0 0; }
.grade { font-size: 12px; padding: 3px 10px; border-radius: 6px; background: #E6F1FB; color: #0C447C; font-weight: 600; }
.route-badge { font-size: 12px; padding: 3px 10px; border-radius: 6px; background: #EAF3DE; color: #173404; font-weight: 600; margin-left: 6px; }
.section { font-size: 15px; font-weight: 600; margin: 14px 0 8px; }
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 8px; }
.metric { background: #F5F4EE; border-radius: 8px; padding: 12px 14px; }
.metric-label { font-size: 12px; color: #6B6963; margin-bottom: 4px; }
.metric-value { font-size: 20px; font-weight: 600; }
.metric-trend { font-size: 12px; margin-top: 2px; }
.up { color: #639922; }
.down { color: #E24B4A; }
.pb-hero { background: #EEEDFE; border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
.pb-hero-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.pb-pct { font-size: 30px; font-weight: 600; color: #3C3489; }
.pb-label { font-size: 13px; color: #534AB7; margin-left: 8px; }
.pb-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
.pb-stat { background: #fff; border-radius: 8px; padding: 10px 12px; border: 1px solid #CECBF6; }
.pb-stat-label { font-size: 12px; color: #534AB7; }
.pb-stat-value { font-size: 15px; font-weight: 600; color: #3C3489; margin-top: 4px; }
.pb-stat-sub { font-size: 11px; color: #7F77DD; margin-top: 2px; }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid #E8E6DC; overflow-x: auto; }
.tab { padding: 10px 16px; font-size: 14px; cursor: pointer; border: none; background: transparent; color: #6B6963; border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: inherit; font-weight: 500; white-space: nowrap; min-height: 44px; }
.tab.active { color: #1F1E1D; font-weight: 600; border-bottom-color: #1F1E1D; }
.tab-pro.active { border-bottom-color: #378ADD; color: #0C447C; }
.tab-gen.active { border-bottom-color: #EF9F27; color: #633806; }
.tab-hs.active { border-bottom-color: #97C459; color: #173404; }
.tab-pb.active { border-bottom-color: #7F77DD; color: #3C3489; }
.tab-summary { display: flex; gap: 18px; padding: 10px 14px; background: #F5F4EE; border-radius: 8px; margin-bottom: 10px; font-size: 12px; flex-wrap: wrap; }
.tab-sum-item { display: flex; flex-direction: column; }
.tab-sum-label { color: #6B6963; font-size: 11px; }
.tab-sum-val { font-weight: 600; font-size: 14px; }
.goal-box { background: #F5F4EE; border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
.goal-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
.goal-pct { font-size: 30px; font-weight: 600; color: #1D9E75; }
.bar-track { height: 14px; background: #fff; border-radius: 7px; overflow: hidden; border: 1px solid #E8E6DC; }
.bar-fill { height: 100%; background: #1D9E75; transition: width 0.5s ease; }
.goal-meta { display: flex; justify-content: space-between; font-size: 12px; color: #6B6963; margin-top: 8px; flex-wrap: wrap; gap: 4px; }
.chart-wrap { height: 140px; margin: 8px 0; }
.chart-square { height: 220px; position: relative; }
.top-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; font-size: 14px; border-bottom: 1px dashed #E8E6DC; }
.top-row:last-child { border-bottom: none; }
.top-row-pb { background: #F5F4FE; padding: 10px 10px; border-radius: 6px; border-bottom: none; margin-bottom: 2px; }
.top-rank { width: 28px; text-align: center; font-weight: 600; color: #6B6963; }
.top-name { flex: 1; }
.top-cat { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
.cat-pro { background: #E6F1FB; color: #0C447C; }
.cat-gen { background: #FAEEDA; color: #633806; }
.cat-hs { background: #EAF3DE; color: #173404; }
.cat-pb { background: #CECBF6; color: #3C3489; }
.top-amount { font-weight: 600; min-width: 80px; text-align: right; }
.cat-grid { display: grid; grid-template-columns: 220px 1fr; gap: 20px; align-items: center; }
.cat-item { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; border-bottom: 1px dashed #E8E6DC; }
.cat-dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }
.news { padding: 12px 14px; background: #F5F4EE; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
.memo-section { display: flex; flex-direction: column; gap: 10px; }
.memo-quick-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
.memo-quick-tags span { font-size: 12px; color: #6B6963; align-self: center; }
.qtag { padding: 8px 14px; border: 1.5px solid #E8E6DC; background: #fff; border-radius: 20px; cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 500; min-height: 38px; transition: all 0.15s; }
.qtag:hover, .qtag:active { background: #F5F4EE; border-color: #1D9E75; }
.memo-input-row { display: flex; gap: 8px; align-items: flex-start; }
.memo-input { flex: 1; min-height: 90px; resize: vertical; font-size: 15px; padding: 12px 14px; border: 1px solid #E8E6DC; border-radius: 8px; font-family: inherit; line-height: 1.6; }
.memo-input:focus { outline: none; border-color: #1D9E75; }
.voice-btn { width: 52px; height: 52px; border-radius: 50%; border: 2px solid #E8E6DC; background: #fff; cursor: pointer; font-size: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; margin-top: 2px; }
.voice-btn:active, .voice-btn.recording { background: #FBE5E5; border-color: #E24B4A; box-shadow: 0 0 0 4px rgba(226,75,74,0.15); }
.voice-status { font-size: 12px; color: #6B6963; text-align: center; margin-top: 2px; }
.voice-status.active { color: #E24B4A; font-weight: 600; }
.memo-actions { display: flex; gap: 8px; }
.memo-actions button { padding: 10px 16px; border: 1px solid #E8E6DC; background: #fff; border-radius: 8px; cursor: pointer; font-size: 14px; font-family: inherit; min-height: 44px; }
.memo-actions button:hover { background: #F5F4EE; }
.memo-save-btn { background: #1D9E75 !important; color: #fff !important; border-color: #1D9E75 !important; font-weight: 600 !important; }
.memo-item { background: #F5F4EE; border-radius: 8px; padding: 12px 14px; margin: 8px 0; font-size: 13px; }
.memo-time { font-size: 11px; color: #6B6963; margin-bottom: 4px; }
.ai-box { background: #EAF3DE; border-left: 3px solid #639922; padding: 10px 12px; margin-top: 8px; font-size: 13px; color: #173404; border-radius: 0 6px 6px 0; }
.insight { margin-top: 12px; padding: 12px 14px; background: #F5F4EE; border-radius: 8px; font-size: 13px; line-height: 1.6; }
.empty { padding: 16px; text-align: center; color: #6B6963; font-size: 12px; background: #F5F4EE; border-radius: 8px; }
.welcome { text-align: center; padding: 48px 24px; color: #6B6963; }
.welcome h3 { color: #1F1E1D; margin: 0 0 8px; font-size: 18px; }

/* ===== MAP MODAL ===== */
#MapModal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #fff; z-index: 2000; flex-direction: column; }
#MapModal.open { display: flex; }
.map-header { padding: 14px 20px; background: #fff; border-bottom: 1px solid #E8E6DC; display: flex; align-items: center; gap: 14px; flex-shrink: 0; z-index: 10; }
.map-close-btn { padding: 8px 16px; border: 1px solid #E8E6DC; background: #fff; border-radius: 8px; cursor: pointer; font-size: 14px; font-family: inherit; min-height: 44px; }
.map-title { font-size: 16px; font-weight: 600; flex: 1; }
.map-legend { display: flex; gap: 14px; font-size: 13px; align-items: center; }
.legend-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.map-locate-btn { padding: 8px 14px; background: #1D9E75; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit; min-height: 44px; }
#map { flex: 1; min-height: 0; }
.lf-popup h4 { margin: 0 0 6px; font-size: 15px; }
.lf-popup .lf-sub { font-size: 12px; color: #6B6963; margin-bottom: 8px; }
.lf-popup .lf-route { background: #EAF3DE; color: #173404; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; display: inline-block; margin-bottom: 8px; }
.lf-popup .lf-route-list { font-size: 11px; color: #6B6963; margin-bottom: 8px; line-height: 1.6; }
.lf-popup .lf-sales { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.lf-popup .lf-btn { display: block; width: 100%; padding: 8px; background: #1D9E75; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; margin-top: 6px; }
.lf-popup .lf-btn-new { background: #2d9c5a; }
.lf-popup .lf-new-badge { background: #EAF3DE; color: #1a6635; padding: 3px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; display: inline-block; margin-bottom: 8px; }
.lf-popup .lf-grade { font-size: 11px; padding: 2px 7px; border-radius: 4px; background: #E6F1FB; color: #0C447C; margin-left: 4px; font-weight: 600; }

/* ===== USER SELECT OVERLAY ===== */
#UserSelect {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: #F5F4EE;
  z-index: 3000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: 60px;
  padding-left: 24px;
  padding-right: 24px;
}
#UserSelect.hidden { display: none; }
.us-logo { margin-bottom: 10px; line-height: 0; }
.us-title { text-align: center; margin-bottom: 32px; }
.us-title h1 { font-size: 24px; margin: 0 0 6px; color: #1F1E1D; }
.us-title p { font-size: 13px; color: #6B6963; margin: 0; }
.us-box {
  width: 100%; max-width: 360px;
  background: radial-gradient(circle, #FDFAF0 55%, transparent 56%);
  padding-top: 120px;
  position: relative;
}
.us-box::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 300px; height: 300px;
  border-radius: 50%;
  border: 10px solid #C9A227;
  background: #FDFAF0;
  box-shadow: 0 0 0 3px #e8d48a55;
  pointer-events: none;
  z-index: 0;
}
.us-search-wrap { position: relative; margin-bottom: 8px; z-index: 1; }
.us-ring-deco {
  width: 300px; height: 300px;
  border-radius: 50%;
  border: 10px solid #C9A227;
  background: #FDFAF0;
  box-shadow: 0 0 0 3px #e8d48a55, 0 8px 32px rgba(201,162,39,0.15);
  margin: 0 auto;
  pointer-events: none;
}
.us-ring-wrap {
  display: flex; align-items: center; justify-content: center;
  width: 300px; height: 300px;
  border-radius: 50%;
  border: 10px solid #C9A227;
  background: #FDFAF0;
  box-shadow: 0 0 0 3px #e8d48a55, 0 8px 32px rgba(201,162,39,0.15);
  margin: 0 auto 8px;
  position: relative;
  overflow: visible;
}
.us-ring-inner {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 78%;
}
.us-select-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 13px 18px;
  border: 2px solid #C9A227; border-radius: 10px;
  background: #fff; cursor: pointer;
  font-family: Georgia, serif; font-size: 17px; font-weight: bold;
  color: #C9A227; letter-spacing: 2px;
  user-select: none;
}
.us-select-btn:hover { background: #FDF8E8; }
.us-search-input {
  width: 100%; padding: 12px 14px; font-size: 15px;
  border: 2px solid #C9A227; border-radius: 10px;
  background: #fff; font-family: inherit; color: #1F1E1D;
  outline: none; cursor: pointer; text-align: center;
  font-weight: 600;
}
.us-search-input::placeholder {
  color: #C9A227; font-weight: 700; letter-spacing: 1px;
}
.us-search-input:focus { border-color: #1D9E75; box-shadow: 0 0 0 3px rgba(29,158,117,0.1); }
.us-dropdown {
  position: absolute; top: calc(100% + 4px); left: 50%; transform: translateX(-50%);
  width: 220px;
  background: #fff; border: 1px solid #E8E6DC; border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15); z-index: 9999;
  overflow-y: auto; max-height: 380px;
  display: none;
}
.us-dropdown.open { display: block; }
.us-dd-group-label { padding: 8px 14px 4px; font-size: 11px; font-weight: 700; color: #aaa; letter-spacing: 0.5px; background: #FAFAF6; }
.us-dd-item {
  padding: 12px 18px; cursor: pointer; font-size: 15px; font-weight: 600;
  color: #1F1E1D; border-bottom: 1px solid #F5F4EE; display: flex;
  align-items: center; justify-content: space-between;
}
.us-dd-item:last-child { border-bottom: none; }
.us-dd-item:hover { background: #F0FBF6; color: #1D9E75; }
.us-dd-item .us-dd-team { font-size: 11px; color: #aaa; font-weight: 400; }
.us-footer { font-size: 12px; color: #bbb; text-align: center; margin-top: 16px; }
#UsLoadMsg { text-align: center; padding: 40px 20px; }
#UsLoadMsg .load-icon { font-size: 36px; margin-bottom: 12px; }
#UsLoadMsg .load-text { font-size: 15px; color: #1F1E1D; font-weight: 600; margin-bottom: 4px; }
#UsLoadMsg .load-sub { font-size: 13px; color: #6B6963; }

/* ===== 필터바 ===== */
.filter-bar { background:#fff; border:1px solid #E8E6DC; border-radius:10px; padding:10px 16px; margin-bottom:10px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.filter-label { font-size:12px; font-weight:700; color:#6B6963; letter-spacing:0.5px; padding-right:10px; border-right:1px solid #E8E6DC; }
.filter-item { display:flex; align-items:center; gap:6px; }
.filter-name { font-size:12px; color:#6B6963; }
.filter-month-btn { width:26px; height:26px; border:1px solid #E8E6DC; background:#F5F4EE; border-radius:5px; cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; font-family:inherit; }
.filter-month-btn:hover { background:#E8E6DC; }
.filter-month-val { font-size:15px; font-weight:700; color:#1F1E1D; min-width:58px; text-align:center; font-family:monospace; }
.filter-target-val { font-size:15px; font-weight:700; color:#1D9E75; cursor:pointer; padding:3px 10px; border:1.5px dashed #1D9E75; border-radius:6px; min-width:120px; text-align:center; }
.filter-target-val:hover { background:#F0FBF6; }
.filter-sep { width:1px; height:24px; background:#E8E6DC; }

.pb-modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.45); z-index:1000; justify-content:center; align-items:flex-start; padding-top:60px; }
.pb-modal-overlay.open { display:flex; }
.pb-modal { background:#fff; border-radius:14px; width:92%; max-width:520px; max-height:80vh; overflow-y:auto; padding:20px; box-shadow:0 8px 40px rgba(0,0,0,0.18); }
.pb-modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.pb-modal-title { font-size:16px; font-weight:700; color:#3C3489; }
.pb-modal-close { font-size:22px; cursor:pointer; color:#888; border:none; background:none; line-height:1; }
.pb-modal-item { display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid #F0EEE5; font-size:13px; }
.pb-modal-item:last-child { border-bottom:none; }
.pb-modal-bar-wrap { flex:1; height:6px; background:#EDE9FF; border-radius:3px; overflow:hidden; }
.pb-modal-bar { height:100%; background:#6C5CE7; border-radius:3px; }
.pb-modal-amt { width:80px; text-align:right; font-weight:600; color:#3C3489; flex-shrink:0; }
</style>
</head>
<body>

<!-- ====== USER SELECT OVERLAY ====== -->
<div id="UserSelect">
  <div id="UsSelectContent">
    <div class="us-logo" style="display:none;">
      <svg width="130" height="130" viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
        <!-- 바깥 골드 링 -->
        <circle cx="65" cy="65" r="56" fill="none" stroke="#C9A227" stroke-width="9"/>
        <!-- 안쪽 원 (옅은 골드 배경) -->
        <circle cx="65" cy="65" r="47" fill="#FDFAF0"/>
        <!-- ONE 텍스트 -->
        <text x="65" y="48" text-anchor="middle"
          font-family="Georgia, serif"
          font-size="20" font-weight="bold" letter-spacing="3"
          fill="#C9A227">ONE</text>
        <!-- 클릭 물결 (작은 원호들) -->
        <path d="M 78 72 Q 84 65 78 58" fill="none" stroke="#C9A227" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
        <path d="M 83 76 Q 93 65 83 54" fill="none" stroke="#C9A227" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
        <!-- 마우스 커서 (크고 명확하게, 원 중앙) -->

async function initFirebase() {

      const s = document.createElement('script');
      s.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
    await new Promise((res, rej) => {
      if (window.firebase && window.firebase.firestore) { res(); return; }
      const s = document.createElement('script');
      s.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js';
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    _db = firebase.firestore();
    _fbReady = true;
    return true;
  } catch(e) {
    console.warn('Firebase 초기화 실패, localStorage 사용:', e);

}

let currentMonth = 6;
let userMonthlyTarget = 0;

function changeMonth(delta) {
  const newM = currentMonth + delta;
  if (newM < 1 || newM > 6) { alert('1~6월 데이터만 있습니다.'); return; }
  currentMonth = newM;
  // DATA 월별 매출 업데이트
  Object.keys(DATA).forEach(name => {
    const real = PHARMACY_REAL[name];
    if (real) {
      DATA[name].sales = real.monthly[currentMonth] || 0;
      DATA[name].monthCurrent = DATA[name].sales;
      const rAmt = (RETURN_AMTS_MONTHLY[name] && RETURN_AMTS_MONTHLY[name][currentMonth]) ? RETURN_AMTS_MONTHLY[name][currentMonth] : 0;
      DATA[name].returnAmt = rAmt;
      DATA[name].returnRate = DATA[name].sales > 0 ? Math.round(rAmt / DATA[name].sales * 1000) / 10 : 0;
      DATA[name].monthGoal = calc3mGoal(name, currentMonth);
      const rProM = (PRO_MONTHLY[name] && PRO_MONTHLY[name][currentMonth]) ? PRO_MONTHLY[name][currentMonth] : 0;
      const rGenM = (GEN_MONTHLY[name] && GEN_MONTHLY[name][currentMonth]) ? GEN_MONTHLY[name][currentMonth] : 0;
      const rPbM  = (PB_MONTHLY[name] && PB_MONTHLY[name][currentMonth]) ? PB_MONTHLY[name][currentMonth] : (PHARMACY_REAL[name] ? Math.round(PHARMACY_REAL[name].pb / 6) : 0);
      const rAnM  = PHARMACY_REAL[name] ? Math.round(PHARMACY_REAL[name].animal / 6) : 0;
      const s = DATA[name].sales;
      DATA[name].catSales = { pro: rProM, gen: rGenM, animal: rAnM, pb: rPbM };
      DATA[name].catRatio = {
        pro:    s > 0 ? Math.round(rProM / s * 100) : 0,
        gen:    s > 0 ? Math.round(rGenM / s * 100) : 0,
        animal: s > 0 ? Math.round(rAnM  / s * 100) : 0,
        pb:     s > 0 ? Math.round(rPbM  / s * 100) : 0
      };
      const pbItemsRealCM = (PB_ITEMS_MONTHLY[name]) ? PB_ITEMS_MONTHLY[name] : {};
      DATA[name].pbThisMonthItems = Object.entries(pbItemsRealCM)
        .filter(([k, v]) => v[currentMonth] && v[currentMonth].a > 0)
        .map(([k, v]) => ({ name: k, sales: v[currentMonth].a, qty: v[currentMonth].q }))
        .sort((a, b) => b.sales - a.sales);
      DATA[name].proTop = Object.entries(PRO_ITEMS_MONTHLY[name]||{})
        .map(([k,v])=>({name:k,sales:v[currentMonth]?v[currentMonth].a:0,qty:v[currentMonth]?v[currentMonth].q:0}))
        .filter(x=>x.sales>0).sort((a,b)=>b.sales-a.sales);
      DATA[name].genTop = Object.entries(GEN_ITEMS_MONTHLY[name]||{})
        .map(([k,v])=>({name:k,sales:v[currentMonth]?v[currentMonth].a:0,qty:v[currentMonth]?v[currentMonth].q:0}))
        .filter(x=>x.sales>0).sort((a,b)=>b.sales-a.sales);
    }
  });
  updateFilterBar();
  if (curName && DATA[curName]) render(curName);
  else if (currentUser) renderSummary(currentUser.name);
}

function setUserTarget() {
  const cur = userMonthlyTarget > 0 ? userMonthlyTarget : '';
  const input = prompt('월 목표액을 입력하세요 (숫자만):\n예: 730000000  (7억 3천만원)', cur);
  if (input === null) return;
  const val = parseInt(String(input).replace(/[^0-9]/g, ''));
  if (isNaN(val) || val <= 0) { alert('올바른 금액을 입력해주세요.'); return; }
  userMonthlyTarget = val;
  updateFilterBar();
  saveUserTargetToFirestore();
  if (currentUser) renderSummary(currentUser.name);
}

function updateFilterBar() {
  const monthEl = document.getElementById('MonthDisplay');
  const targetEl = document.getElementById('TargetDisplay');
  if (monthEl) monthEl.textContent = '2026.' + String(currentMonth).padStart(2, '0');
  if (targetEl) targetEl.textContent = userMonthlyTarget > 0
    ? userMonthlyTarget.toLocaleString() + ' ✏️'
    : '설정하기 ✏️';
}

async function saveUserTargetToFirestore() {
  if (!currentUser) return;
  try {
    const ok = await initFirebase();
    if (!ok) { localStorage.setItem('oneclick-target-' + currentUser.id, userMonthlyTarget); return; }
    await _db.collection('users').doc(currentUser.id).set({ monthlyTarget: userMonthlyTarget }, { merge: true });
  } catch(e) {
    localStorage.setItem('oneclick-target-' + currentUser.id, userMonthlyTarget);
  }
}

function calc3mGoal(name, baseMonth) {
  const real = PHARMACY_REAL[name];
  if (!real) return 0;
  // baseMonth 기준 직전 3개월 평균
  const months = [];
  for (let m = baseMonth - 3; m < baseMonth; m++) {
    if (m >= 1 && real.monthly[m]) months.push(real.monthly[m]);
  }
  // 직전 3개월 데이터 없으면 가용 월 전체 평균
  if (months.length === 0) {
    const all = Object.values(real.monthly);
    return all.length > 0 ? Math.round(all.reduce((a,b)=>a+b,0)/all.length) : 0;
  }
  return Math.round(months.reduce((a,b)=>a+b,0)/months.length);
}

function makeData(arr) {
  const [name, region, pharmacist, grade, sales, trend, _returnRate, debt, _monthGoal, pbRatio, hasVet, vetM, route, lat, lng] = arr;
  const monthGoal = PHARMACY_REAL[name] ? calc3mGoal(name, currentMonth) : _monthGoal;
  const returnAmt = (RETURN_AMTS_MONTHLY[name] && RETURN_AMTS_MONTHLY[name][currentMonth]) ? RETURN_AMTS_MONTHLY[name][currentMonth] : 0;
  const returnRate = sales > 0 ? Math.round(returnAmt / sales * 1000) / 10 : (RETURN_RATES[name] !== undefined ? RETURN_RATES[name] : _returnRate);
  const real = PHARMACY_REAL[name];
  let realPbM     = (PB_MONTHLY[name] && PB_MONTHLY[name][currentMonth]) ? PB_MONTHLY[name][currentMonth] : (real ? Math.round(real.pb / 6) : 0);
  const realAnimalM = real ? Math.round(real.animal / 6) : 0;
  const realProM0  = (PRO_MONTHLY[name] && PRO_MONTHLY[name][currentMonth]) ? PRO_MONTHLY[name][currentMonth] : 0;
  const realGenM0  = (GEN_MONTHLY[name] && GEN_MONTHLY[name][currentMonth]) ? GEN_MONTHLY[name][currentMonth] : 0;
  const pbActual     = sales > 0 ? Math.round(realPbM / sales * 100) : 0;
  const animalActual = sales > 0 ? Math.round(realAnimalM / sales * 100) : 0;
  const proActual    = sales > 0 ? Math.round(realProM0 / sales * 100) : 0;
  const genActual    = sales > 0 ? Math.round(realGenM0 / sales * 100) : 0;
  const proR = proActual;
  const genR = genActual;
  const catRatio = { pro: proActual, gen: genActual, animal: animalActual, pb: pbActual };
  const realProM  = (PRO_MONTHLY[name] && PRO_MONTHLY[name][currentMonth]) ? PRO_MONTHLY[name][currentMonth] : Math.round(sales * proR / 100);
  const realGenM  = (GEN_MONTHLY[name] && GEN_MONTHLY[name][currentMonth]) ? GEN_MONTHLY[name][currentMonth] : Math.round(sales * genR / 100);
  const catSales = {
    pro:    realProM,
    gen:    realGenM,
    animal: realAnimalM,
    pb:     realPbM
  };
  const pos = trend.startsWith('+');
  const catTrend = {
    pro:    pos ? '+'+(Math.floor(Math.random()*10)+3)+'%' : '-'+(Math.floor(Math.random()*8)+3)+'%',
    gen:    pos ? '+'+(Math.floor(Math.random()*6)+1)+'%'  : '-'+(Math.floor(Math.random()*6)+2)+'%',
    animal: animalActual > 0 ? '+'+(Math.floor(Math.random()*10)+1)+'%' : '-',
    pb:     trend
  };
  const monthCurrent = sales;
  const daily = [0];
  for (let i=1; i<=30; i++) {
    if (i>=24) daily.push(monthCurrent);
    else daily.push(Math.round(monthCurrent * i / 24));
  }
  // 전문약/일반약 실제 데이터
  function getRealTop(dataObj, phName, month) {
    const items = dataObj[phName] || {};
    return Object.entries(items)
      .map(([k,v]) => ({ name: k, sales: v[month] ? v[month].a : 0, qty: v[month] ? v[month].q : 0 }))
      .filter(x => x.sales > 0)
      .sort((a,b) => b.sales - a.sales);
  }
  const proTop = getRealTop(PRO_ITEMS_MONTHLY, name, currentMonth);
  const genTop = getRealTop(GEN_ITEMS_MONTHLY, name, currentMonth);
  const animalTop = [];
  // PB 품목별 실제 월별 데이터 사용
  const pbItemsReal = PB_ITEMS_MONTHLY[name] || {};
  const pbThisMonthItems = Object.entries(pbItemsReal)
    .filter(([k, v]) => v[currentMonth] && v[currentMonth].a > 0)
    .map(([k, v]) => ({ name: k, sales: v[currentMonth].a, qty: v[currentMonth].q }))
    .sort((a, b) => b.sales - a.sales);
  // PB 실제 합계로 catSales.pb 보정
  const pbRealSum = pbThisMonthItems.reduce((s, x) => s + (x.sales||0), 0);
  if (pbRealSum > 0) realPbM = pbRealSum;
  return {
    name, region, pharmacist, grade, sales, salesTrend: trend, returnRate, returnAmt, debt,
    monthGoal, monthCurrent, monthDay: 24, monthDays: 30,
    daily, proTop, genTop, animalTop, pbThisMonthItems,
    catRatio, catSales, catTrend,
    pb3mAvg:  (() => {
      const pbM = PB_MONTHLY[name] || {};
      const months = [currentMonth-3, currentMonth-2, currentMonth-1].filter(m => m >= 1 && pbM[m]);
      return months.length > 0 ? Math.round(months.reduce((s,m) => s + pbM[m], 0) / months.length) : realPbM;
    })(),
    vet3mAvg: realAnimalM,
    news: NEWS,
    memo: [],
    route, lat, lng,
    proGrade: (real && real.proGrade) ? real.proGrade : { A: 30, B: 25, C: 20, D: 15, E: 7, F: 3 }
  };
}

function onQuery() {
  const q = document.getElementById('Q').value.trim();
  const dd = document.getElementById('Dropdown');
  if (!q) {
    const all = Object.keys(DATA);
    dd.innerHTML = '<div class="dd-count">거래처 (총 ' + all.length + '곳)</div>' +
      all.map(ddRow).join('');
    dd.style.display = 'block'; return;
  }
  const matches = Object.keys(DATA).filter(name => name.includes(q));
  if (matches.length === 0) {
    dd.innerHTML = '<div class="dd-empty">"' + q + '" 매칭 거래처 없음</div>';
  } else {
    dd.innerHTML = '<div class="dd-count">' + matches.length + '곳 매칭</div>' + matches.map(ddRow).join('');
  }
  dd.style.display = 'block';
}

function ddRow(name) {
  const d = DATA[name];
  const gC = d.grade === 'B' ? 'dd-grade dd-grade-B' : d.grade === 'C' ? 'dd-grade dd-grade-C' : 'dd-grade';
  return '<div class="dd-item" onclick="pick(\'' + name + '\')"><div><span class="dd-name">' + name + '</span><span class="' + gC + '">' + d.grade + '</span></div><div class="dd-sub">' + d.region + ' · 약사 ' + d.pharmacist + ' · ' + fmt(d.sales) + ' (<span class="' + (d.salesTrend.startsWith('+')?'up':'down') + '">' + d.salesTrend + '</span>)</div></div>';
}

function pick(name) {
  document.getElementById('Q').value = name;
  document.getElementById('Dropdown').style.display = 'none';
  render(name);
}

function doSearch() {
  const q = document.getElementById('Q').value.trim();
  if (!q) return;
  const found = Object.keys(DATA).find(k => k.includes(q));
  if (found) pick(found);
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.search')) document.getElementById('Dropdown').style.display = 'none';
});

function switchTab(tab) {

  document.getElementById('tab-'+tab).classList.add('active');
  document.getElementById('tab-content').innerHTML = renderTab(curName, tab);

function renderTab(name, tab) {
  const d = DATA[name];

  // ── 노선 비교 탭 ──────────────────────────────────
  if (tab === 'trend') {
    const routeInfo = ROUTE_INFO[d.route] || {};
    const members = routeInfo.members || [];
    if (!members.length) return '<div class="empty">노선 정보 없음</div>';
    const routeData = members.map(m => DATA[m]).filter(Boolean);
    const sorted = [...routeData].sort((a,b) => b.sales - a.sales);
    const maxSales = Math.max(...sorted.map(x=>x.sales), 1);
    let h = '<div style="font-size:12px;color:#888;margin-bottom:10px;">📦 '+d.route+' ('+routeInfo.days+') · '+members.length+'개 거래처 매출 비교</div>';
    sorted.forEach((r, i) => {
      const isMe = (r.name === name);
      const pct = Math.round(r.sales / maxSales * 100);
      const shortN = r.name.split(' ').slice(1).join(' ') || r.name;
      const pbR = r.catRatio ? r.catRatio.pb : 0;
      h += '<div style="padding:8px 0;border-bottom:1px solid #F0EEE5;'+(isMe?'background:#F5F4FE;margin:0 -12px;padding:8px 12px;border-radius:6px;':'')+ '">';
      h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">';
      h += '<span style="width:18px;text-align:center;font-weight:700;color:#888;font-size:12px;">'+(i+1)+'</span>';
      h += '<span style="flex:1;font-size:13px;font-weight:'+(isMe?700:400)+';color:'+(isMe?'#3C3489':'#2B2B2B')+';">'+shortN+(isMe?' ◀':'')+'</span>';
      h += '<span style="font-size:11px;color:#888;">PB '+pbR+'%</span>';
      h += '<span style="font-size:13px;font-weight:600;color:'+(isMe?'#3C3489':'#2B2B2B')+';">'+fmt(r.sales)+'</span>';
      h += '</div>';
      h += '<div style="display:flex;gap:2px;align-items:center;">';
      h += '<div style="width:18px;"></div>';
      h += '<div style="flex:1;height:6px;background:#F0EEE5;border-radius:3px;"><div style="height:100%;width:'+pct+'%;background:'+(isMe?'#3C3489':'#B0A8E0')+';border-radius:3px;"></div></div>';
      h += '</div></div>';
    });
    return h;
  }

  // ── 신규/이탈 품목 탭 ─────────────────────────────
  if (tab === 'new') {
    const prevM = currentMonth - 1;
    const proNow  = new Set(Object.entries(PRO_ITEMS_MONTHLY[name]||{}).filter(([k,v])=>v[currentMonth]&&v[currentMonth].a>0).map(([k])=>k));
    const proPrev = new Set(Object.entries(PRO_ITEMS_MONTHLY[name]||{}).filter(([k,v])=>prevM>=1&&v[prevM]&&v[prevM].a>0).map(([k])=>k));
    const genNow  = new Set(Object.entries(GEN_ITEMS_MONTHLY[name]||{}).filter(([k,v])=>v[currentMonth]&&v[currentMonth].a>0).map(([k])=>k));
    const genPrev = new Set(Object.entries(GEN_ITEMS_MONTHLY[name]||{}).filter(([k,v])=>prevM>=1&&v[prevM]&&v[prevM].a>0).map(([k])=>k));
    const newPro  = [...proNow].filter(k=>!proPrev.has(k));
    const lostPro = [...proPrev].filter(k=>!proNow.has(k));
    const newGen  = [...genNow].filter(k=>!genPrev.has(k));
    const lostGen = [...genPrev].filter(k=>!genNow.has(k));
    let h = '<div style="font-size:12px;color:#888;margin-bottom:10px;">'+(prevM>=1?(prevM+'월→'+currentMonth+'월'):'첫 달')+' 비교 · 실제 출고 기준</div>';
    const section = (title, color, emoji, items, dataObj) => {
      if (!items.length) return '<div style="font-size:12px;color:#aaa;padding:4px 0;">'+emoji+' '+title+': 없음</div>';
      let s = '<div style="font-weight:700;font-size:12px;color:'+color+';margin:8px 0 4px;">'+emoji+' '+title+' ('+items.length+'개)</div>';
      items.forEach(k => {
        const v = (dataObj[name]||{})[k];
        const amt = v&&v[currentMonth]?v[currentMonth].a:(v&&prevM>=1&&v[prevM]?v[prevM].a:0);
        s += '<div style="font-size:12px;padding:3px 0 3px 12px;border-bottom:1px solid #F5F4EE;">'+k+' <span style="color:#888;float:right;">'+fmt(amt)+'</span></div>';
      });
      return s;
    };
    h += section('신규 전문약', '#3C3489', '🆕', newPro, PRO_ITEMS_MONTHLY);
    h += section('신규 일반약', '#1D9E75', '🆕', newGen, GEN_ITEMS_MONTHLY);
    h += section('이탈 전문약', '#E24B4A', '📤', lostPro, PRO_ITEMS_MONTHLY);
    h += section('이탈 일반약', '#BA7517', '📤', lostGen, GEN_ITEMS_MONTHLY);
    if (!newPro.length && !newGen.length && !lostPro.length && !lostGen.length)
      h += '<div class="empty">전월 대비 변동 없음</div>';
    return h;
  }

  // ── 전문약 / 일반약 탭 ────────────────────────────
  let list, label, catClass, dataObj;
  if (tab === 'pro') { list = d.proTop; label = '전문약'; catClass = 'pro'; dataObj = PRO_ITEMS_MONTHLY; }
  else { list = d.genTop; label = '일반약'; catClass = 'gen'; dataObj = GEN_ITEMS_MONTHLY; }
  // 전체 거래처 중 각 품목 주문처 수 + 약국명 목록
  const pharmCounts = {};
  window._tabPharmMap = {};
  Object.entries(dataObj).forEach(([ph, items]) => {
    const shortPh = ph.split(' ').slice(1).join(' ') || ph;
    Object.entries(items).forEach(([k,v]) => {
      if (v[currentMonth] && v[currentMonth].a > 0) {
        pharmCounts[k] = (pharmCounts[k]||0) + 1;
        if (!window._tabPharmMap[k]) window._tabPharmMap[k] = [];

  h += '</div>';
  if (list.length === 0) { h += '<div class="empty">'+currentMonth+'월 '+label+' 출고 내역 없음</div>'; return h; }
  list.forEach((item, i) => {
    const pc = pharmCounts[item.name] || 0;
    const ep = item.name.replace(/'/g,"\\'");
    h += '<div class="top-row"><div class="top-rank">'+(i+1)+'</div>';
    h += '<div class="top-name">'+item.name;
    if (item.qty) h += ' <span style="font-size:11px;color:#888;">'+item.qty+'개</span>';
    if (pc) h += ' <span style="font-size:11px;color:#6C5CE7;cursor:pointer;text-decoration:underline;" onclick="showTabPharms(\''+ep+'\')">'+pc+'처</span>';

  return h;
}

function openProGenModal(tab, name) {
  const d = DATA[name];
  const isPro = (tab === 'pro');
  const label = isPro ? '전문약' : '일반약';
  const catClass = isPro ? 'pro' : 'gen';
  const dataObj = isPro ? PRO_ITEMS_MONTHLY : GEN_ITEMS_MONTHLY;
  const list = isPro ? d.proTop : d.genTop;
  // 처수 맵 빌드
  window._tabPharmMap = {};
  const pharmCounts = {};
  Object.entries(dataObj).forEach(([ph, items]) => {
    const shortPh = ph.split(' ').slice(1).join(' ') || ph;
    Object.entries(items).forEach(([k,v]) => {
      if (v[currentMonth] && v[currentMonth].a > 0) {
        pharmCounts[k] = (pharmCounts[k]||0) + 1;
        if (!window._tabPharmMap[k]) window._tabPharmMap[k] = [];
        window._tabPharmMap[k].push(shortPh);
      }
    });
  });
  const total = list.reduce((s,x) => s + x.sales, 0);
  const grandMax = list.length > 0 ? list[0].sales : 1;
  let html = '<div style="display:flex;gap:16px;font-size:12px;color:#888;margin-bottom:12px;flex-wrap:wrap;">';
  html += '<span>'+label+' <strong style="color:#2B2B2B;">'+list.length+'개 품목</strong></span>';
  html += '<span>합계 <strong style="color:#2B2B2B;">'+fmt(total)+'</strong></span>';
  html += '<span>비중 <strong style="color:#2B2B2B;">'+d.catRatio[tab]+'%</strong></span>';
  html += '<span>전월 대비 <strong class="'+(d.catTrend[tab].startsWith('+')?'up':'down')+'">'+d.catTrend[tab]+'</strong></span>';
  html += '</div>';
  html += '<div id="tabPharmDetail" style="display:none;background:#F0EEFF;border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:10px;line-height:1.8;"></div>';
  if (list.length === 0) { html += '<div class="empty">'+currentMonth+'월 출고 내역 없음</div>'; }
  else {
    list.forEach((item, i) => {
      const pc = pharmCounts[item.name] || 0;
      const ep = item.name.replace(/'/g,"\\'");
      const pct = Math.round(item.sales / grandMax * 100);
      html += '<div class="pb-modal-item">';
      html += '<span style="width:120px;flex-shrink:0;font-size:13px;">'+(i+1)+'. '+item.name+'</span>';
      if (item.qty) html += '<span style="width:28px;text-align:right;color:#888;font-size:11px;flex-shrink:0;">'+item.qty+'개</span>';
      if (pc) html += '<span style="width:26px;text-align:right;color:#6C5CE7;font-size:11px;flex-shrink:0;cursor:pointer;text-decoration:underline;" onclick="showTabPharms(\''+ep+'\')">'+pc+'처</span>';
      html += '<div class="pb-modal-bar-wrap"><div class="pb-modal-bar" style="width:'+pct+'%;background:'+(isPro?'#378ADD':'#EF9F27')+'"></div></div>';
      html += '<span class="pb-modal-amt">'+fmt(item.sales)+'</span>';
      html += '</div>';
    });
  }
  openModal(currentMonth+'월 '+label+' 품목 ('+name.split(' ').slice(1).join(' ')+')', html);
}

function showTabPharms(prod) {
  const list = (window._tabPharmMap || {})[prod] || [];
  const el = document.getElementById('tabPharmDetail');
  if (!el) return;
  if (el._lastProd === prod && el.style.display !== 'none') { el.style.display='none'; el._lastProd=null; return; }
  el._lastProd = prod;
  el.innerHTML = '<span style="font-weight:700;color:#3C3489;">'+prod+'</span> 거래처 ('+list.length+'처)<br>'
    + list.map(p=>'<span style="display:inline-block;background:#E8E4FF;color:#3C3489;border-radius:6px;padding:2px 8px;margin:2px;font-size:12px;">'+p+'</span>').join('');
  el.style.display = 'block';
}

function insertTag(tag) {

// ============================================================
let recognition = null;
let isRecording = false;

function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.lang = 'ko-KR'; r.continuous = true; r.interimResults = true;
  return r;
}

function toggleVoice(name) {
  const btn = document.getElementById('VoiceBtn');
  const status = document.getElementById('VoiceStatus');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('이 브라우저는 음성 입력을 지원하지 않습니다.\nSafari(iOS 14.5+) 또는 Chrome에서 이용하세요.'); return; }
  if (isRecording) {
    if (recognition) recognition.stop();
    isRecording = false;
    btn.classList.remove('recording'); btn.textContent = '🎤';
    status.textContent = '음성'; status.classList.remove('active');
  } else {
    recognition = initRecognition();
    if (!recognition) return;
    isRecording = true;
    btn.classList.add('recording'); btn.textContent = '⏹';
    status.textContent = '녹음 중...'; status.classList.add('active');
    const el = document.getElementById('Memo');
    let baseText = el.value;
    recognition.onresult = function(e) {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      if (final) { baseText += final + ' '; }
      el.value = baseText + interim;
      el.scrollTop = el.scrollHeight;
    };
    recognition.onerror = function(e) {
      isRecording = false;
      if (btn) { btn.classList.remove('recording'); btn.textContent = '🎤'; }
      if (status) { status.textContent = '음성'; status.classList.remove('active'); }
      if (e.error !== 'aborted') alert('음성 인식 오류: ' + e.error);
    };
    recognition.onend = function() { if (isRecording) recognition.start(); };
    recognition.start();
  }
}

function loadScript(src, check) {
  return new Promise((resolve, reject) => {
    if (window[check]) { resolve(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

const MEMO_KEY = 'oneclick-smalltalk-memos-v4';

function loadMemosFromStorage() {
  try {

    if (!saved) return;
    const memos = JSON.parse(saved);
    Object.keys(memos).forEach(name => { if (DATA[name]) DATA[name].memo = memos[name]; });
  } catch(e) {}
}

function saveMemosToStorage() {
  try {
    const memos = {};
    Object.keys(DATA).forEach(name => { if (DATA[name].memo && DATA[name].memo.length > 0) memos[name] = DATA[name].memo; });
    localStorage.setItem(MEMO_KEY, JSON.stringify(memos));
  } catch(e) {}
}

async function loadMemosFromFirestore(userId) {
  try {
    const ok = await initFirebase();
    if (!ok) { loadMemosFromStorage(); return; }
    const doc = await Promise.race([
      _db.collection('users').doc(userId).get(),
      new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 5000))
    ]);
    if (doc.exists) {
      const data = doc.data();
      if (data.memos) { Object.keys(data.memos).forEach(name => { if (DATA[name]) DATA[name].memo = data.memos[name]; }); }
      if (data.goals) { Object.keys(data.goals).forEach(name => { if (DATA[name]) DATA[name].monthGoal = data.goals[name]; }); }
      if (data.sales) { Object.keys(data.sales).forEach(name => { if (DATA[name]) { DATA[name].sales = data.sales[name]; DATA[name].monthCurrent = Math.round(data.sales[name] * 0.81); } }); }
    }
  } catch(e) {
    console.warn('Firestore 불러오기 실패, localStorage 사용:', e);
    loadMemosFromStorage();
  }
}

async function saveMemosToFirestore() {
  if (!currentUser) { saveMemosToStorage(); return; }
  try {
    const ok = await initFirebase();
    if (!ok) { saveMemosToStorage(); return; }
    const memos = {};
    Object.keys(DATA).forEach(name => { if (DATA[name].memo && DATA[name].memo.length > 0) memos[name] = DATA[name].memo; });
    await _db.collection('users').doc(currentUser.id).set({ memos }, { merge: true });
    saveMemosToStorage();
  } catch(e) { console.warn('Firestore 저장 실패:', e); saveMemosToStorage(); }
}

  const rows = [['거래처명','등급','담당루트','작성일시','메모내용']];
  let cnt = 0;
  Object.keys(DATA).forEach(name => {
    const d = DATA[name];
    if (d.memo && d.memo.length > 0) { d.memo.forEach(m => { rows.push([name, d.grade||'', d.route||'', m.time||'', m.text||'']); cnt++; }); }
  });

  const csv = rows.map(r => r.map(v => '"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');

function initMap() {

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors', maxZoom: 19 }).addTo(leafletMap);
  Object.values(DATA).forEach(d => {

    const marker = L.circleMarker([d.lat, d.lng], { radius: 10, fillColor: '#1D74C8', color: '#fff', weight: 2, opacity: 1, fillOpacity: 0.9 }).addTo(leafletMap);
    const pHtml = '<div style="min-width:180px;"><h4>🏪 '+d.name+'</h4><div style="font-size:12px;color:#666;margin-bottom:6px;">'+d.region+'</div><div style="font-weight:600;margin-bottom:8px;">'+fmt(d.sales)+'</div><button onclick="pickFromMap(this.dataset.n)" data-n="'+d.name+'" style="width:100%;padding:8px;background:#1D9E75;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;">자세히 보기 →</button></div>';
    marker.bindPopup(pHtml, { maxWidth: 240 });
  });
}

function pickFromMap(name) { closeMap(); document.getElementById('Q').value = name; pick(name); }

function locateMe() {
  if (!navigator.geolocation) { alert('위치 서비스를 지원하지 않습니다.'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    if (!leafletMap) return;
    if (locMarker) locMarker.remove();
    locMarker = L.circleMarker([lat, lng], { radius: 8, fillColor: '#E24B4A', color: '#fff', weight: 2, fillOpacity: 1 }).addTo(leafletMap);
    locMarker.bindPopup('📍 내 현재 위치').openPopup();
    leafletMap.setView([lat, lng], 14);
  }, () => { alert('위치를 가져올 수 없습니다. 위치 권한을 허용해주세요.'); });
}

      if (amt > 0) {
        totals[prod] = (totals[prod] || 0) + amt;
        qtotals[prod] = (qtotals[prod]||0) + (months[currentMonth].q||0);
        ptotals[prod] = (ptotals[prod]||0) + 1;
        if (!pharmsMap[prod]) pharmsMap[prod] = [];
        pharmsMap[prod].push(shortPh);
      }
    });
  });
  window._pbPharmMap = pharmsMap;
  const sorted = Object.entries(totals).sort((a,b) => b[1]-a[1]);
  const grandTotal = sorted.reduce((s,[,v])=>s+v,0);
  let html = '<div style="font-size:12px;color:#888;margin-bottom:10px;">총 '+sorted.length+'개 품목 / 합계 '+fmt(grandTotal)+'원</div>';
  html += '<div id="pbPharmDetail" style="display:none;background:#F0EEFF;border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:10px;line-height:1.7;"></div>';
  sorted.forEach(([prod, amt]) => {
    const pct = grandTotal>0?Math.round(amt/grandTotal*100):0;
    const isKw = kws.some(kw=>prod.includes(kw));
    const q = qtotals[prod]||0;
    const p = ptotals[prod]||0;
    const escapedProd = prod.replace(/'/g,"\\'");
    html += '<div class="pb-modal-item"><span style="width:100px;flex-shrink:0;'+(isKw?'font-weight:700;color:#3C3489;':'')+'">' +prod+(isKw?' ★':'')+'</span><span style="width:28px;text-align:right;color:#888;font-size:11px;flex-shrink:0;">'+q+'개</span><span style="width:26px;text-align:right;color:#6C5CE7;font-size:11px;flex-shrink:0;cursor:pointer;text-decoration:underline;" onclick="showPbPharmsFor(\''+escapedProd+'\')">'+p+'처</span><div class="pb-modal-bar-wrap"><div class="pb-modal-bar" style="width:'+pct+'%"></div></div><span class="pb-modal-amt">'+fmt(amt)+'</span></div>';
  });
  openModal(currentMonth+'월 전 거래처 PB 품목별 합계', html);
}

// 카드2: 해당 약국 출하 품목
function openPharmPbModal(name) {
  const items = PB_ITEMS_MONTHLY[name] || {};
  const sorted = Object.entries(items)
    .map(([k,v])=>({name:k,amt:v[currentMonth]?v[currentMonth].a:0,qty:v[currentMonth]?v[currentMonth].q:0}))
    .filter(x=>x.amt>0).sort((a,b)=>b.amt-a.amt);
  const total = sorted.reduce((s,x)=>s+x.amt,0);
  let html = '<div style="font-size:12px;color:#888;margin-bottom:10px;">'+sorted.length+'개 품목 / 합계 '+fmt(total)+'원</div>';
  sorted.forEach(x=>{
    const pct = total>0?Math.round(x.amt/total*100):0;
    html += '<div class="pb-modal-item"><span style="width:110px;flex-shrink:0;">'+x.name+'</span><span style="width:30px;text-align:right;color:#888;font-size:11px;flex-shrink:0;">'+(x.qty||0)+'개</span><div class="pb-modal-bar-wrap"><div class="pb-modal-bar" style="width:'+pct+'%"></div></div><span class="pb-modal-amt">'+fmt(x.amt)+'</span></div>';
  });
  openModal(currentMonth+'월 PB 출하 품목 ('+name.split(' ').slice(1).join(' ')+')', html);
}

// 카드3: 21품목 전 거래처 매출 유무
function openPb21CheckModal() {
  const kws = MONTHLY_PB_KEYWORDS[currentMonth] || [];
  if (!kws.length) { openModal('21품목 매출 현황', '<p>이번 달 지정 품목 없음</p>'); return; }
  let html = '<div style="font-size:12px;color:#888;margin-bottom:10px;">'+currentMonth+'월 이달의 PB 21품목 전 거래처 매출 현황</div>';
  kws.forEach(kw => {
    const pharmacies = [];
    Object.entries(PB_ITEMS_MONTHLY).forEach(([ph, items]) => {
      const matched = Object.entries(items).find(([k]) => k.includes(kw));
      if (matched && matched[1][currentMonth] && matched[1][currentMonth].a > 0) pharmacies.push(ph.split(' ').slice(1).join(' '));
    });
    const hasAny = pharmacies.length > 0;
    html += '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #F0EEE5;">';
    html += '<span style="font-size:16px;">'+(hasAny?'✅':'❌')+'</span>';
    html += '<span style="flex:1;font-size:13px;font-weight:'+(hasAny?600:400)+';">'+kw+'</span>';
    html += '<span style="font-size:11px;color:#888;">'+pharmacies.length+'곳</span>';
    html += '</div>';
    if (hasAny) html += '<div style="font-size:11px;color:#6C5CE7;padding:2px 28px 6px;border-bottom:1px solid #F0EEE5;">'+pharmacies.join(', ')+'</div>';
  });
  openModal(currentMonth+'월 PB 21품목 매출 현황', html);
}

// 카드4: 해당 거래처 동물약 + 전거래처 상위 품목
function openVetModal(name) {
  const myItems = ANIMAL_ITEMS_MONTHLY[name] || {};
  const mySorted = Object.entries(myItems)
    .map(([k,v])=>({name:k,amt:v[currentMonth]||0}))
    .filter(x=>x.amt>0).sort((a,b)=>b.amt-a.amt);
  const allTotals = {};
  Object.values(ANIMAL_ITEMS_MONTHLY).forEach(items=>{
    Object.entries(items).forEach(([k,v])=>{
      const a=v[currentMonth]||0; if(a>0) allTotals[k]=(allTotals[k]||0)+a;
    });
  });
  const allSorted = Object.entries(allTotals).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const allTotal = Object.values(allTotals).reduce((s,v)=>s+v,0);
  const myTotal = mySorted.reduce((s,x)=>s+x.amt,0);
  let html = '';
  const shortN = name.split(' ').slice(1).join(' ');
  html += '<div style="font-weight:700;font-size:13px;color:#3C3489;margin-bottom:6px;">📍 '+shortN+' ('+fmt(myTotal)+'원)</div>';
  if (mySorted.length === 0) {
    html += '<div style="font-size:12px;color:#888;padding:8px 0 12px;">이번 달 동물약 매출 없음</div>';
  } else {
    mySorted.forEach(x=>{
      const pct=myTotal>0?Math.round(x.amt/myTotal*100):0;
      html += '<div class="pb-modal-item"><span style="width:130px;flex-shrink:0;font-size:12px;">'+x.name+'</span><div class="pb-modal-bar-wrap"><div class="pb-modal-bar" style="width:'+pct+'%;background:#00b894;"></div></div><span class="pb-modal-amt">'+fmt(x.amt)+'</span></div>';
    });
  }
  html += '<div style="font-weight:700;font-size:13px;color:#1D9E75;margin:14px 0 6px;">🏆 전 거래처 상위 품목 ('+fmt(allTotal)+'원)</div>';
  allSorted.forEach(([prod,amt])=>{
    const pct=allTotal>0?Math.round(amt/allTotal*100):0;
    const isMe = (myItems[prod]&&(myItems[prod][currentMonth]||0)>0);
    html += '<div class="pb-modal-item"><span style="width:130px;flex-shrink:0;font-size:12px;'+(isMe?'font-weight:700;':'')+'">'+prod+(isMe?' ✓':'')+'</span><div class="pb-modal-bar-wrap"><div class="pb-modal-bar" style="width:'+pct+'%;background:#1D9E75;"></div></div><span class="pb-modal-amt">'+fmt(amt)+'</span></div>';
  });
  openModal(currentMonth+'월 동물약 현황 ('+shortN+')', html);
}
</script>
